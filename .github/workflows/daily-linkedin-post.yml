name: Daily LinkedIn Autonomous Post

on:
  schedule:
    # 05:00 UTC = 10:00 AM PKT (Morning professional rush)
    # 14:00 UTC = 07:00 PM PKT (Evening prime engagement)
    - cron: '0 5,14 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger from GitHub Actions'

jobs:
  publish_linkedin_post:
    name: Generate & Publish Tech Carousel to LinkedIn
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Social Cron Endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://www.pakodrive.pk"
          fi
          
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          echo "Triggering LinkedIn Auto-Post at: ${SITE_URL}/api/cron/auto-social"

          MAX_ATTEMPTS=2
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "--- Attempt $ATTEMPT of $MAX_ATTEMPTS ---"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 180 -X POST "${SITE_URL}/api/cron/auto-social" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${CRON_SECRET}")

            HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

            echo "Response Status: $HTTP_STATUS"
            echo "Response Body:"
            echo "$HTTP_BODY"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              SUCCESS=1
              break
            fi

            echo "Attempt $ATTEMPT returned status $HTTP_STATUS. Retrying in 10 seconds..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::LinkedIn auto-post request failed after $MAX_ATTEMPTS attempts with status $HTTP_STATUS"
            exit 1
          fi

          echo "LinkedIn carousel post published successfully!"
