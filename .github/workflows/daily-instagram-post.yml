name: Daily Instagram Autonomous Post

on:
  schedule:
    # 05:00 UTC = 10:00 AM PKT (Morning prime rush)
    # 14:00 UTC = 07:00 PM PKT (Evening prime engagement)
    - cron: '0 5,14 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger from GitHub Actions'

jobs:
  publish_instagram_post:
    name: Generate & Publish Tech Carousel to Instagram
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Instagram Cron Endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://www.pakodrive.pk"
          fi
          
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          echo "Triggering Instagram Auto-Post at: ${SITE_URL}/api/cron/auto-instagram"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${SITE_URL}/api/cron/auto-instagram" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Instagram auto-post request failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Instagram carousel post published successfully!"
