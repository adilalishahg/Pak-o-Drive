name: Daily Autonomous AI Auto-Blogger

on:
  schedule:
    # 04:00 UTC = 9:00 AM PKT (Morning rush)
    # 13:00 UTC = 6:00 PM PKT (Evening prime browsing)
    - cron: '0 4,13 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual test from GitHub Actions'

jobs:
  publish_auto_blog:
    name: Generate & Publish Auto Blog
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Blog Cron Endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://www.pakodrive.pk"
          fi
          
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          echo "Triggering Autonomous Auto-Blog at: ${SITE_URL}/api/cron/auto-blog"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${SITE_URL}/api/cron/auto-blog" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Auto-blog cron request failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Autonomous blog post published successfully!"
