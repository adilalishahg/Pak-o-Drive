name: Auto Deploy to Alwaysdata (WhatsApp Bot)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Alwaysdata via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ssh-adilalishahg.alwaysdata.net
          username: adilalishahg
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 60s
          script: |
            echo "🚀 [Auto-Deploy] Pulling latest code on Alwaysdata..."
            cd /home/adilalishahg/Pak-o-Drive || exit 0
            git pull origin main
            cp src/worker/bot.mjs /home/adilalishahg/bot/bot.mjs 2>/dev/null || true
            echo "🔄 [Auto-Deploy] Reloading WhatsApp Bot Service..."
            killall -9 node 2>/dev/null || pkill -9 -f "bot.mjs" 2>/dev/null || true
            echo "✅ [Auto-Deploy] Finished successfully!"
            exit 0



