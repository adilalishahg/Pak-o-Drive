<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Lightning Bolt Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF" />
      <stop offset="100%" stop-color="#0080E6" />
    </linearGradient>

    <!-- Speed Arrow & Arc Gradient -->
    <linearGradient id="orangeGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Darker Shadow Blue for 3D Layering -->
    <linearGradient id="darkBlueArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#004499" />
    </linearGradient>
  </defs>

  <!-- ==================== LEFT ICON ==================== -->
  <g id="logo-icon" transform="translate(40, 30)">
    <!-- Base Circular Energy Rings (Orange & Blue Tracks) -->
    <!-- Top-Right / Outer Orange Arc -->
    <path d="M 175 65 A 95 95 0 0 1 250 170" stroke="#FF7B00" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 70 210 A 95 95 0 0 1 110 260" stroke="#FF7B00" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Inner Blue Dynamic Track -->
    <path d="M 85 105 A 85 85 0 0 1 200 70" stroke="url(#darkBlueArc)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 120 250 A 85 85 0 0 0 240 215" stroke="url(#blueGlow)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 145 268 A 95 95 0 0 0 230 245" stroke="#0099FF" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Bottom-Left Outer Blue Arc -->
    <path d="M 50 150 A 110 110 0 0 0 95 240" stroke="#00B4D8" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Dynamic Orange Speed Swoosh with Arrow -->
    <!-- Outer Orange Swoosh wrapping bottom to center -->
    <path d="M 38 185 C 36 225, 80 255, 140 240 C 205 220, 245 155, 275 85" 
          stroke="url(#orangeGlow)" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Kinetic Arrowhead pointing up-right -->
    <polygon points="275,55 295,95 248,82" fill="#FF8800"/>
    <polygon points="275,55 248,82 265,98" fill="#E65100" opacity="0.6"/>

    <!-- Sharp Electric Lightning Bolt (Centerpiece) -->
    <!-- Shadow / Base Layer for 3D depth -->
    <polygon points="215,20 162,130 220,130 115,280 158,165 105,165" fill="#0066B3" />
    <!-- Bright Top Bolt -->
    <polygon points="210,25 168,135 225,135 125,270 162,160 112,160" fill="url(#blueGlow)" />
    <!-- Highlight Blade -->
    <polygon points="210,25 178,135 198,135 125,270 155,160 128,160" fill="#E0F7FF" opacity="0.35"/>
  </g>

  <!-- ==================== RIGHT TYPOGRAPHY ==================== -->
  <g id="logo-text" transform="translate(420, 165)">
    <!-- WORD: PAKO -->
    <text x="0" y="0" 
          font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
          font-size="105" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#00A8E8">
      PAKO
    </text>

    <!-- WORD: DRIVE -->
    <text x="0" y="95" 
          font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
          font-size="105" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#FF7A00">
      DRIVE
    </text>

    <!-- Dynamic Double Underline Swooshes (Drive Motion) -->
    <!-- Top Blue Wave -->
    <path d="M 0 108 C 80 108, 140 125, 230 122 C 310 118, 355 106, 385 96 C 360 112, 290 130, 200 130 C 110 130, 50 112, 0 108 Z" 
          fill="#0099FF"/>
    
    <!-- Bottom Orange Extended Wave / Tail -->
    <path d="M 140 122 C 175 145, 220 160, 275 152 C 330 144, 380 125, 410 105 C 385 128, 325 152, 250 148 C 190 145, 155 130, 140 122 Z" 
          fill="#FF7A00"/>
  </g>
</svg>
