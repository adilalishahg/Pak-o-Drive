<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic AI Carousel - Slobodan Standard</title>
  <style>
    body { background: #030712; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 28px; margin-bottom: 20px; color: #00F5D4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; max-width: 1400px; width: 100%; }
    .card { background: #0B132B; border: 1px solid #1E293B; border-radius: 16px; overflow: hidden; }
    .card img { width: 100%; display: block; }
    .footer { margin-top: 40px; color: #64748B; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Autonomous AI Agents - Slobodan Gajić Design Standard</h1>
  <div class="grid">
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_1.jpg" alt="Slide 1">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_2.jpg" alt="Slide 2">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_3.jpg" alt="Slide 3">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_4.jpg" alt="Slide 4">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_5.jpg" alt="Slide 5">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_6.jpg" alt="Slide 6">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_7.jpg" alt="Slide 7">
      </div>
    
      <div class="card">
        <img src="/carousel-renders/agentic_slide_8.jpg" alt="Slide 8">
      </div>
    
  </div>
  <div class="footer">Pak-o-Drive LinkedIn Carousel Suite</div>
</body>
</html>
